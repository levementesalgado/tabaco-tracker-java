services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tabaco_tracker
      POSTGRES_USER: tabaco
      POSTGRES_PASSWORD: tabaco123
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tabaco"], interval: 5s, timeout: 5s, retries: 5 }

  redis:
    image: redis:alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  java-api:
    build: ./java
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tabaco_tracker
      SPRING_DATASOURCE_USERNAME: tabaco
      SPRING_DATASOURCE_PASSWORD: tabaco123
      SPRING_REDIS_HOST: redis
      JWT_SECRET: dev-secret-change-in-prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  php-web:
    build: ./php
    ports: ["80:80"]
    environment:
      API_URL: http://java-api:8080
      JWT_SECRET: dev-secret-change-in-prod
    depends_on: [java-api]

volumes: { pgdata:, redisdata: }
